  <style>
    /* ==========================================================================
       Global Reset & Foundation
       ========================================================================== */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      /* Emil Kowalski Animation Easing Curves */
      --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
      --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);
      --ease-drawer: cubic-bezier(0.32, 0.72, 0, 1);
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      color: #211513;
      background-color: #FAF8F5;
      line-height: 1.5;
      overflow-x: hidden;
      padding-bottom: 96px; /* Room for floating bottom picker */
    }

    #stage {
      width: 100%;
      min-height: 100vh;
      position: relative;
    }

    /* Sub-300ms motion utilities (Emil Kowalski standards) */
    .motion-fade-up {
      animation: protoFadeUp 240ms var(--ease-out) forwards;
    }

    @keyframes protoFadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      .motion-fade-up {
        animation: none !important;
        opacity: 1 !important;
        transform: none !important;
      }
      html {
        scroll-behavior: auto !important;
      }
      button, a, .proto-picker[data-ready] .proto-picker-highlight {
        transition: none !important;
      }
    }

    /* Emil Kowalski Button Principle: Responsive Press with scale(0.97) */
    button, input[type="button"], input[type="submit"], a.btn {
      transition: transform 160ms var(--ease-out), background-color 160ms ease, box-shadow 160ms ease, color 160ms ease;
    }
    button:active, input[type="button"]:active, input[type="submit"]:active, a.btn:active {
      transform: scale(0.97);
    }

    /* Shimmer Skeletons for Image Loading */
    .proto-img-skeleton {
      background: linear-gradient(110deg, #ece9e6 8%, #f5f3f0 18%, #ece9e6 33%);
      background-size: 200% 100%;
      animation: protoShimmer 1.5s linear infinite;
    }
    .proto-img-skeleton-dark {
      background: linear-gradient(110deg, #251c19 8%, #362925 18%, #251c19 33%);
      background-size: 200% 100%;
      animation: protoShimmer 1.5s linear infinite;
    }
    @keyframes protoShimmer {
      to { background-position-x: -200%; }
    }

    /* ==========================================================================
       PICKER.MD SPECIFICATION (COPIED VERBATIM)
       ========================================================================== */
    .proto-picker {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 2147483647;
      display: flex;
      align-items: center;
      gap: 2px;
      padding: 4px;
      border-radius: 999px;
      background: rgba(10, 10, 10, 0.84);
      -webkit-backdrop-filter: blur(12px) saturate(1.4);
      backdrop-filter: blur(12px) saturate(1.4);
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.08) inset,
        0 8px 24px rgba(0, 0, 0, 0.24),
        0 2px 6px rgba(0, 0, 0, 0.12);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 13px;
      line-height: 1;
      -webkit-font-smoothing: antialiased;
      user-select: none;
      -webkit-user-select: none;
      max-width: 96vw;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .proto-picker::-webkit-scrollbar {
      display: none;
    }

    .proto-picker-highlight {
      position: absolute;
      top: 4px;
      left: 0;
      height: 28px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.14);
      will-change: transform;
    }

    .proto-picker[data-ready] .proto-picker-highlight {
      transition:
        transform 250ms cubic-bezier(0.23, 1, 0.32, 1),
        width 250ms cubic-bezier(0.23, 1, 0.32, 1);
    }

    @media (prefers-reduced-motion: reduce) {
      .proto-picker[data-ready] .proto-picker-highlight { transition: none; }
    }

    .proto-picker-item {
      position: relative;
      display: flex;
      align-items: center;
      white-space: nowrap;
      height: 28px;
      padding: 0 11px;
      border: 0;
      border-radius: 999px;
      background: transparent;
      color: rgba(255, 255, 255, 0.6);
      font: inherit;
      cursor: pointer;
      transition: color 150ms ease-out;
    }

    .proto-picker-item:hover {
      color: rgba(255, 255, 255, 0.9);
    }

    .proto-picker-item:active {
      transform: scale(0.97);
    }

    .proto-picker-item:focus-visible {
      outline: 2px solid rgba(255, 255, 255, 0.4);
      outline-offset: 2px;
    }

    .proto-picker-item[data-active] {
      color: #FFFFFF;
      font-weight: 600;
    }

    .proto-picker-divider {
      width: 1px;
      height: 14px;
      margin: 0 3px;
      background: rgba(255, 255, 255, 0.16);
      flex-shrink: 0;
    }

    .proto-picker-replay {
      padding: 0 9px;
      font-size: 14px;
    }

    /* Responsive Interruptible Toast Notification */
    .proto-toast {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(-100px);
      background: #111;
      color: #FFF;
      padding: 10px 20px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      z-index: 2147483646;
      box-shadow: 0 6px 16px rgba(0,0,0,0.2);
      transition: transform 220ms var(--ease-out);
      display: flex;
      align-items: center;
      gap: 8px;
      pointer-events: none;
    }
    .proto-toast.visible {
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>

    /* Global Smooth Scrolling Function */
    window.smoothScrollTo = function(id) {
      if (!id) return;
      const cleanId = (typeof id === 'string' && id.startsWith('#')) ? id.slice(1) : id;
      const el = document.getElementById(cleanId);
      if (el) {
        el.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
    };

    /* Global Image Lifecycle: Remove skeleton on load, set fallback on error */
    document.addEventListener('load', function(e) {
      if (e.target && e.target.tagName === 'IMG') {
        e.target.classList.remove('proto-img-skeleton', 'proto-img-skeleton-dark');
      }
    }, true);
    document.addEventListener('error', function(e) {
      if (e.target && e.target.tagName === 'IMG') {
        if (e.target.src !== FALLBACK_IMG) {
          e.target.src = FALLBACK_IMG;
        } else {
          e.target.classList.remove('proto-img-skeleton', 'proto-img-skeleton-dark');
        }
      }
    }, true);

    /* Toast trigger */
    window.showToast = function(msg) {
      const t = document.getElementById('protoToast');
      const m = document.getElementById('protoToastMsg');
      if (!t || !m) return;
      m.textContent = msg;
      t.classList.add('visible');
      clearTimeout(window._toastTimer);
      window._toastTimer = setTimeout(() => t.classList.remove('visible'), 2200);
    };

    /* Interactive Stepper Helper */
    window.updateQty = function(btn, delta) {
      const parent = btn.closest('.proto-stepper');
      if (!parent) return;
      const countEl = parent.querySelector('.stepper-count');
      let count = parseInt(countEl.textContent, 10) || 1;
      count = Math.max(1, count + delta);
      countEl.textContent = count;
    };

              .v9-sheet-close { position: absolute; top: 1rem; right: 1.25rem; background: #F1F5F9; border: none; border-radius: 50%; width: 28px; height: 28px; font-weight: 700; color: #64748B; cursor: pointer; display: flex; align-items: center; justify-content: center; }
            </style>

            <div class="v9-app-frame">
              <!-- Top Status -->
              <div class="v9-status-bar">
                <span>9:41</span>
                <span>Airport Rd Kitchen • Open Now</span>
                <span>100%</span>
              </div>

              <!-- Brand Header -->
              <div class="v9-top-header">
                <div class="v9-app-brand" onclick="smoothScrollTo('v9-stories')">
                  <span>🎂</span> Cakesbynessahh
                </div>
                <div style="font-size: 0.75rem; background: #F1F5F9; padding: 0.3rem 0.6rem; border-radius: 999px; font-weight: 700;">
                  Benin City
                </div>
              </div>

              <!-- Circular Category Story Bubbles -->
              <div class="v9-stories-strip" id="v9-stories">
                <div class="v9-story-bubble" onclick="smoothScrollTo('menu')">
                  <div class="v9-ring"><img src="${BAKERY_DATA[0].image}" class="v9-avatar" alt="Cakes"></div>
                  <span class="v9-story-label">Cakes</span>
                </div>
                <div class="v9-story-bubble" onclick="smoothScrollTo('menu')">
                  <div class="v9-ring"><img src="${BAKERY_DATA[3].image}" class="v9-avatar" alt="Bento"></div>
                  <span class="v9-story-label">Bento</span>
                </div>
                <div class="v9-story-bubble" onclick="smoothScrollTo('menu')">
                  <div class="v9-ring"><img src="${BAKERY_DATA[6].image}" class="v9-avatar" alt="Parfaits"></div>
                  <span class="v9-story-label">Parfaits</span>
                </div>
                <div class="v9-story-bubble" onclick="smoothScrollTo('menu')">
                  <div class="v9-ring"><img src="${BAKERY_DATA[4].image}" class="v9-avatar" alt="Pastries"></div>
                  <span class="v9-story-label">Pastries</span>
                </div>
                <div class="v9-story-bubble" onclick="smoothScrollTo('menu')">
                  <div class="v9-ring"><img src="${BAKERY_DATA[5].image}" class="v9-avatar" alt="Chops"></div>
                  <span class="v9-story-label">Chops</span>
                </div>
              </div>

              <!-- Feed Items -->
              <div class="v9-feed-container" id="menu">
                <div style="font-size: 0.85rem; font-weight: 800; color: #475569;">Featured Daily Bakes</div>

                ${BAKERY_DATA.slice(0, 5).map(item => `
                  <div class="v9-feed-card">
                    <img src="${item.image}" alt="${item.name}" class="v9-feed-img proto-img-skeleton" loading="lazy" onerror="this.onerror=null;this.src='${FALLBACK_IMG}'">
                    <div class="v9-feed-body">
                      <div class="v9-feed-dim">${item.size}</div>
                      <h4 class="v9-feed-title">${item.name}</h4>
                      <p style="font-size: 0.8rem; color: #64748B; margin-top: 0.2rem;">${item.desc}</p>
                      <div class="v9-feed-footer">
                        <span class="v9-feed-price">${item.price}</span>
                        <button class="v9-view-sheet-btn" onclick="v9OpenSheet('${item.name}', '${item.price}', '${item.size}')">Quick Tap</button>
                      </div>
                    </div>
                  </div>
                `).join('')}

                <!-- Custom Studio in Feed -->
                <div id="custom-studio" style="background: #FFF1F2; border: 1px solid #FECDD3; border-radius: 14px; padding: 1.25rem;">
                  <h4 style="font-weight: 800; color: #881337;">Custom Cake Inscription</h4>
                  <p style="font-size: 0.75rem; color: #9F1239; margin-top: 0.2rem;">Write your custom wording for Airport Road pickup.</p>
                  <input type="text" placeholder="e.g. Happy Birthday Blessing" value="Happy Birthday Blessing" style="width: 100%; padding: 0.6rem; margin: 0.6rem 0; border: 1px solid #FECDD3; border-radius: 6px; font-size: 0.85rem;">
                  <button class="v9-view-sheet-btn" style="width: 100%;" onclick="showToast('Saved custom inscription!')">Save Custom Cake</button>
                </div>
              </div>

              <!-- App Bottom Tab Bar -->
              <div class="v9-bottom-bar">
                <button class="v9-tab active" onclick="smoothScrollTo('v9-stories')"><span>🏠</span><span>Feed</span></button>
                <button class="v9-tab" onclick="smoothScrollTo('menu')"><span>🍰</span><span>Menu</span></button>
                <button class="v9-tab" onclick="smoothScrollTo('custom-studio')"><span>🎨</span><span>Studio</span></button>
                <button class="v9-tab" onclick="showToast('2 items in bag')"><span>🛍️</span><span>Bag (2)</span></button>
              </div>

              <!-- Slide-Up Sheet Drawer -->
              <div class="v9-sheet-overlay" id="v9SheetOverlay" onclick="v9CloseSheet(event)">
                <div class="v9-sheet-content" onclick="event.stopPropagation()">
                  <button class="v9-sheet-close" onclick="v9CloseSheet()" aria-label="Close drawer">✕</button>
                  <div style="width: 40px; height: 4px; background: #CBD5E1; border-radius: 999px; margin: 0 auto 1rem;"></div>
                  <h3 id="v9SheetTitle" style="font-size: 1.25rem; font-weight: 800;">Cake Details</h3>
                  <div id="v9SheetDim" style="font-size: 0.8rem; color: #8E1633; font-weight: 700; margin: 0.2rem 0 0.8rem;"></div>
                  <div style="font-size: 1.4rem; font-weight: 800; color: #0F172A;" id="v9SheetPrice">₦28,000</div>
                  <div style="background: #F8FAFC; border-radius: 8px; padding: 0.8rem; margin: 1rem 0; font-size: 0.8rem; color: #475569;">
                    ✓ Pre-dispatch WhatsApp photo included<br>
                    ✓ Pay on Delivery available in Benin City
                  </div>
                  <button style="width: 100%; padding: 0.85rem; background: #25D366; color: white; border: none; border-radius: 8px; font-weight: 700; font-size: 0.95rem; cursor: pointer;" onclick="window.open('https://wa.me/2349059340229?text=Hello%20Cakesbynessahh%2C%20I%20want%20to%20order%20from%20the%20app')">
                    1-Tap WhatsApp Order
                  </button>
                </div>
              </div>
            </div>
          </div>
        `;
      }

    ];

    /* ==========================================================================
       Interactive Event Helpers for Bespoke Studio (Variant 3), Zones (Variant 7),
       Streams (Variant 8), & App Shell (Variant 9)
       ========================================================================== */
    window.v1FilterCategory = function(btn, cat) {
      document.querySelectorAll('.v1-pill').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      showToast('Category: ' + cat);
      smoothScrollTo('menu');
    };

    window.v3SelectSize = function(el, dim, price) {
      document.querySelectorAll('#v3SizeGroup .v3-chip').forEach(c => c.classList.remove('selected'));
      el.classList.add('selected');
      const pPrice = document.getElementById('v3PreviewPrice');
      const pMeta = document.getElementById('v3PreviewMeta');
      if (pPrice) pPrice.textContent = price;
      if (pMeta) {
        const parts = pMeta.textContent.split('•').map(s => s.trim());
        pMeta.textContent = `${dim} • ${parts[1] || 'Red Velvet'}`;
      }
    };

    window.v3ChangeFlavor = function(flavor) {
      const pMeta = document.getElementById('v3PreviewMeta');
      if (pMeta) {
        const parts = pMeta.textContent.split('•').map(s => s.trim());
        pMeta.textContent = `${parts[0] || 'Size 8 (8 x 5 in)'} • ${flavor}`;
      }
    };

    window.v3UpdateInscription = function(val) {
      const el = document.getElementById('v3LiveInscription');
      if (el) el.textContent = val.trim() || 'Your Name / Message';
    };

    window.v7SelectZone = function(el, zone) {
      document.querySelectorAll('.v7-zone-chip').forEach(c => c.classList.remove('active'));
      el.classList.add('active');
      showToast('Delivery zone: ' + zone);
    };

    window.v8SelectStream = function(btn, targetId) {
      document.querySelectorAll('.v8-tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      smoothScrollTo(targetId);
    };

    window.v9OpenSheet = function(name, price, dim) {
      const overlay = document.getElementById('v9SheetOverlay');
      const t = document.getElementById('v9SheetTitle');
      const p = document.getElementById('v9SheetPrice');
      const d = document.getElementById('v9SheetDim');
      if (t) t.textContent = name;
      if (p) p.textContent = price;
      if (d) d.textContent = dim;
      if (overlay) overlay.classList.add('active');
    };

    window.v9CloseSheet = function(e) {
      if (e && e.stopPropagation) e.stopPropagation();
      const overlay = document.getElementById('v9SheetOverlay');
      if (overlay) overlay.classList.remove('active');
    };

    /* ==========================================================================
       PICKER REFERENCE WIRING (COPIED VERBATIM FROM PICKER.MD)
       ========================================================================== */
    const stage = document.getElementById('stage');
    const picker = document.querySelector('.proto-picker');
    const highlight = picker.querySelector('.proto-picker-highlight');
    const items = [...picker.querySelectorAll('.proto-picker-item:not(.proto-picker-replay)')];
    const replay = picker.querySelector('.proto-picker-replay');
    let current = 0;

    function moveHighlight() {
      const el = items[current];
      if (!el) return;
      highlight.style.width = el.offsetWidth + 'px';
      highlight.style.transform = `translateX(${el.offsetLeft}px)`;
    }

    function mount(i) {
      stage.innerHTML = '';
      // Clear first, render next frame, so entrance animations re-run.
      requestAnimationFrame(() => { 
        stage.innerHTML = variants[i](); 
        window.scrollTo({ top: 0, behavior: 'instant' });
      });
    }

    function setActive(i) {
      if (i < 0 || i >= variants.length) return;
      current = i;
      items.forEach((el, j) => {
        el.toggleAttribute('data-active', j === i);
        if (j === i) el.setAttribute('aria-current', 'true');
        else el.removeAttribute('aria-current');
      });
      moveHighlight();
      try {
        const url = new URL(location);
        url.searchParams.set('v', i + 1);
        history.replaceState(null, '', url);
      } catch (e) {
        // Safe fallback for file:/// protocol where replaceState is restricted
      }
      mount(i);
    }

    items.forEach((el, i) => el.addEventListener('click', () => setActive(i)));
    replay?.addEventListener('click', () => mount(current));
    window.addEventListener('resize', moveHighlight);
    window.addEventListener('load', moveHighlight);

    document.addEventListener('keydown', (e) => {
      if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return;
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      const num = parseInt(e.key, 10);
      if (num >= 1 && num <= variants.length) setActive(num - 1);
      else if (e.key === 'ArrowRight') setActive((current + 1) % variants.length);
      else if (e.key === 'ArrowLeft') setActive((current - 1 + variants.length) % variants.length);
      else if (e.key === 'r' || e.key === 'R') mount(current);
    });

    setActive((parseInt(new URLSearchParams(location.search).get('v'), 10) || 1) - 1);
    // Enable the slide only after first paint, so load doesn't animate.
    requestAnimationFrame(() => requestAnimationFrame(() => picker.setAttribute('data-ready', '')));
  </script>
</body>
</html>
